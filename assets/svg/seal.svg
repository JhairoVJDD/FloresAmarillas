<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="waxGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </radialGradient>
    <linearGradient id="embossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#78350F" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Cuerpo del sello con bordes de cera derretida irregular -->
  <path filter="url(#waxShadow)" d="M60,6 
           C75,4 88,14 98,24 
           C108,34 116,48 114,63 
           C112,78 102,92 91,102 
           C80,112 65,115 50,114 
           C35,113 22,106 13,94 
           C4,82 5,66 8,51 
           C11,36 21,22 34,13 
           C42,7 51,7 60,6 Z" 
        fill="url(#waxGrad)" stroke="#B45309" stroke-width="1.5" />

  <!-- Anillo interior en relieve -->
  <circle cx="60" cy="60" r="41" fill="none" stroke="#FEF3C7" stroke-width="2" opacity="0.6" />
  <circle cx="60" cy="60" r="39" fill="none" stroke="#78350F" stroke-width="1.5" opacity="0.4" />

  <!-- Símbolo central: Flor de 5 pétalos y corazón en relieve -->
  <g transform="translate(60, 60)" fill="url(#embossGrad)">
    <!-- Pétalos centrales -->
    <path d="M0,-24 C5,-24 7,-12 0,-8 C-7,-12 -5,-24 0,-24 Z" transform="rotate(0)" />
    <path d="M0,-24 C5,-24 7,-12 0,-8 C-7,-12 -5,-24 0,-24 Z" transform="rotate(72)" />
    <path d="M0,-24 C5,-24 7,-12 0,-8 C-7,-12 -5,-24 0,-24 Z" transform="rotate(144)" />
    <path d="M0,-24 C5,-24 7,-12 0,-8 C-7,-12 -5,-24 0,-24 Z" transform="rotate(216)" />
    <path d="M0,-24 C5,-24 7,-12 0,-8 C-7,-12 -5,-24 0,-24 Z" transform="rotate(288)" />
    <!-- Botón / centro de la flor -->
    <circle cx="0" cy="-2" r="7.5" fill="#FEF08A" stroke="#92400E" stroke-width="1" />
    <circle cx="-1.5" cy="-3.5" r="2" fill="#FFFFFF" opacity="0.7" />
  </g>
</svg>
