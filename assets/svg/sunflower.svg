<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente de pétalos primarios -->
    <linearGradient id="petalGradOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <!-- Gradiente de pétalos secundarios -->
    <linearGradient id="petalGradInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <!-- Gradiente del centro del girasol -->
    <radialGradient id="centerGrad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#5C2D12" />
      <stop offset="50%" stop-color="#381D0B" />
      <stop offset="85%" stop-color="#241005" />
      <stop offset="100%" stop-color="#140702" />
    </radialGradient>
    <!-- Sombra suave para pétalos -->
    <filter id="petalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#78350F" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(100, 100)">
    <!-- Capa 1: Pétalos de atrás -->
    <g filter="url(#petalShadow)">
      <path d="M-8,-20 C-18,-60 0,-92 0,-92 C0,-92 18,-60 8,-20 Z" fill="url(#petalGradOuter)" transform="rotate(0)" />
      <path d="M-8,-20 C-18,-60 0,-92 0,-92 C0,-92 18,-60 8,-20 Z" fill="url(#petalGradOuter)" transform="rotate(22.5)" />
      <path d="M-8,-20 C-18,-60 0,-92 0,-92 C0,-92 18,-60 8,-20 Z" fill="url(#petalGradOuter)" transform="rotate(45)" />
      <path d="M-8,-20 C-18,-60 0,-92 0,-92 C0,-92 18,-60 8,-20 Z" fill="url(#petalGradOuter)" transform="rotate(67.5)" />
      <path d="M-8,-20 C-18,-60 0,-92 0,-92 C0,-92 18,-60 8,-20 Z" fill="url(#petalGradOuter)" transform="rotate(90)" />
      <path d="M-8,-20 C-18,-60 0,-92 0,-92 C0,-92 18,-60 8,-20 Z" fill="url(#petalGradOuter)" transform="rotate(112.5)" />
      <path d="M-8,-20 C-18,-60 0,-92 0,-92 C0,-92 18,-60 8,-20 Z" fill="url(#petalGradOuter)" transform="rotate(135)" />
      <path d="M-8,-20 C-18,-60 0,-92 0,-92 C0,-92 18,-60 8,-20 Z" fill="url(#petalGradOuter)" transform="rotate(157.5)" />
      <path d="M-8,-20 C-18,-60 0,-92 0,-92 C0,-92 18,-60 8,-20 Z" fill="url(#petalGradOuter)" transform="rotate(180)" />
      <path d="M-8,-20 C-18,-60 0,-92 0,-92 C0,-92 18,-60 8,-20 Z" fill="url(#petalGradOuter)" transform="rotate(202.5)" />
      <path d="M-8,-20 C-18,-60 0,-92 0,-92 C0,-92 18,-60 8,-20 Z" fill="url(#petalGradOuter)" transform="rotate(225)" />
      <path d="M-8,-20 C-18,-60 0,-92 0,-92 C0,-92 18,-60 8,-20 Z" fill="url(#petalGradOuter)" transform="rotate(247.5)" />
      <path d="M-8,-20 C-18,-60 0,-92 0,-92 C0,-92 18,-60 8,-20 Z" fill="url(#petalGradOuter)" transform="rotate(270)" />
      <path d="M-8,-20 C-18,-60 0,-92 0,-92 C0,-92 18,-60 8,-20 Z" fill="url(#petalGradOuter)" transform="rotate(292.5)" />
      <path d="M-8,-20 C-18,-60 0,-92 0,-92 C0,-92 18,-60 8,-20 Z" fill="url(#petalGradOuter)" transform="rotate(315)" />
      <path d="M-8,-20 C-18,-60 0,-92 0,-92 C0,-92 18,-60 8,-20 Z" fill="url(#petalGradOuter)" transform="rotate(337.5)" />
    </g>

    <!-- Capa 2: Pétalos del frente ligeramente rotados -->
    <g>
      <path d="M-6,-15 C-14,-50 0,-78 0,-78 C0,-78 14,-50 6,-15 Z" fill="url(#petalGradInner)" transform="rotate(11.25)" />
      <path d="M-6,-15 C-14,-50 0,-78 0,-78 C0,-78 14,-50 6,-15 Z" fill="url(#petalGradInner)" transform="rotate(33.75)" />
      <path d="M-6,-15 C-14,-50 0,-78 0,-78 C0,-78 14,-50 6,-15 Z" fill="url(#petalGradInner)" transform="rotate(56.25)" />
      <path d="M-6,-15 C-14,-50 0,-78 0,-78 C0,-78 14,-50 6,-15 Z" fill="url(#petalGradInner)" transform="rotate(78.75)" />
      <path d="M-6,-15 C-14,-50 0,-78 0,-78 C0,-78 14,-50 6,-15 Z" fill="url(#petalGradInner)" transform="rotate(101.25)" />
      <path d="M-6,-15 C-14,-50 0,-78 0,-78 C0,-78 14,-50 6,-15 Z" fill="url(#petalGradInner)" transform="rotate(123.75)" />
      <path d="M-6,-15 C-14,-50 0,-78 0,-78 C0,-78 14,-50 6,-15 Z" fill="url(#petalGradInner)" transform="rotate(146.25)" />
      <path d="M-6,-15 C-14,-50 0,-78 0,-78 C0,-78 14,-50 6,-15 Z" fill="url(#petalGradInner)" transform="rotate(168.75)" />
      <path d="M-6,-15 C-14,-50 0,-78 0,-78 C0,-78 14,-50 6,-15 Z" fill="url(#petalGradInner)" transform="rotate(191.25)" />
      <path d="M-6,-15 C-14,-50 0,-78 0,-78 C0,-78 14,-50 6,-15 Z" fill="url(#petalGradInner)" transform="rotate(213.75)" />
      <path d="M-6,-15 C-14,-50 0,-78 0,-78 C0,-78 14,-50 6,-15 Z" fill="url(#petalGradInner)" transform="rotate(236.25)" />
      <path d="M-6,-15 C-14,-50 0,-78 0,-78 C0,-78 14,-50 6,-15 Z" fill="url(#petalGradInner)" transform="rotate(258.75)" />
      <path d="M-6,-15 C-14,-50 0,-78 0,-78 C0,-78 14,-50 6,-15 Z" fill="url(#petalGradInner)" transform="rotate(281.25)" />
      <path d="M-6,-15 C-14,-50 0,-78 0,-78 C0,-78 14,-50 6,-15 Z" fill="url(#petalGradInner)" transform="rotate(303.75)" />
      <path d="M-6,-15 C-14,-50 0,-78 0,-78 C0,-78 14,-50 6,-15 Z" fill="url(#petalGradInner)" transform="rotate(326.25)" />
      <path d="M-6,-15 C-14,-50 0,-78 0,-78 C0,-78 14,-50 6,-15 Z" fill="url(#petalGradInner)" transform="rotate(348.75)" />
    </g>

    <!-- Centro / Disco floral -->
    <circle cx="0" cy="0" r="34" fill="url(#centerGrad)" stroke="#B45309" stroke-width="2" />
    
    <!-- Textura y semillas doradas del centro -->
    <g fill="#F59E0B" opacity="0.65">
      <circle cx="-12" cy="-10" r="1.8" />
      <circle cx="0" cy="-16" r="2" />
      <circle cx="14" cy="-12" r="1.7" />
      <circle cx="-18" cy="4" r="2" />
      <circle cx="-6" cy="2" r="2.2" />
      <circle cx="8" cy="4" r="2" />
      <circle cx="19" cy="2" r="1.8" />
      <circle cx="-12" cy="16" r="1.9" />
      <circle cx="2" cy="18" r="2" />
      <circle cx="14" cy="15" r="1.7" />
      <circle cx="-4" cy="-8" r="1.5" fill="#FDE047" />
      <circle cx="6" cy="-6" r="1.6" fill="#FDE047" />
      <circle cx="2" cy="7" r="1.5" fill="#FDE047" />
      <circle cx="-7" cy="8" r="1.5" fill="#FDE047" />
    </g>
  </g>
</svg>
