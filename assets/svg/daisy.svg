<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="daisyPetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="60%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <radialGradient id="daisyCenter" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </radialGradient>
  </defs>
  <g transform="translate(80, 80)">
    <!-- 12 pétalos esbeltos de margarita dorada -->
    <path d="M-5,-10 C-10,-40 0,-65 0,-65 C0,-65 10,-40 5,-10 Z" fill="url(#daisyPetal)" transform="rotate(0)" />
    <path d="M-5,-10 C-10,-40 0,-65 0,-65 C0,-65 10,-40 5,-10 Z" fill="url(#daisyPetal)" transform="rotate(30)" />
    <path d="M-5,-10 C-10,-40 0,-65 0,-65 C0,-65 10,-40 5,-10 Z" fill="url(#daisyPetal)" transform="rotate(60)" />
    <path d="M-5,-10 C-10,-40 0,-65 0,-65 C0,-65 10,-40 5,-10 Z" fill="url(#daisyPetal)" transform="rotate(90)" />
    <path d="M-5,-10 C-10,-40 0,-65 0,-65 C0,-65 10,-40 5,-10 Z" fill="url(#daisyPetal)" transform="rotate(120)" />
    <path d="M-5,-10 C-10,-40 0,-65 0,-65 C0,-65 10,-40 5,-10 Z" fill="url(#daisyPetal)" transform="rotate(150)" />
    <path d="M-5,-10 C-10,-40 0,-65 0,-65 C0,-65 10,-40 5,-10 Z" fill="url(#daisyPetal)" transform="rotate(180)" />
    <path d="M-5,-10 C-10,-40 0,-65 0,-65 C0,-65 10,-40 5,-10 Z" fill="url(#daisyPetal)" transform="rotate(210)" />
    <path d="M-5,-10 C-10,-40 0,-65 0,-65 C0,-65 10,-40 5,-10 Z" fill="url(#daisyPetal)" transform="rotate(240)" />
    <path d="M-5,-10 C-10,-40 0,-65 0,-65 C0,-65 10,-40 5,-10 Z" fill="url(#daisyPetal)" transform="rotate(270)" />
    <path d="M-5,-10 C-10,-40 0,-65 0,-65 C0,-65 10,-40 5,-10 Z" fill="url(#daisyPetal)" transform="rotate(300)" />
    <path d="M-5,-10 C-10,-40 0,-65 0,-65 C0,-65 10,-40 5,-10 Z" fill="url(#daisyPetal)" transform="rotate(330)" />
    
    <!-- Centro -->
    <circle cx="0" cy="0" r="18" fill="url(#daisyCenter)" stroke="#B45309" stroke-width="1.5" />
    <circle cx="-3" cy="-4" r="3" fill="#FEF3C7" opacity="0.5" />
  </g>
</svg>
